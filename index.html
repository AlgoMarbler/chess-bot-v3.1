<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Stock Atlantic Salmon</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
    margin:0;height:100vh;width:100vw;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    background:linear-gradient(135deg,#0a0a1a 0%,#1a1a3e 50%,#0d1b2a 100%);
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
    overflow:hidden;padding:10px
}

.title{
    font-size:clamp(1.5rem,5vw,3rem);
    font-weight:900;text-transform:uppercase;
    letter-spacing:.15em;
    background:linear-gradient(90deg,#00d4ff,#0099ff,#00d4ff);
    background-size:200% auto;
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
    margin-bottom:1rem;
    animation:shimmer 3s linear infinite;
    text-align:center
}
@keyframes shimmer{to{background-position:200% center}}

.game-container{
    padding:10px;background:rgba(0,0,0,.3);
    border-radius:10px;
    border:1px solid rgba(0,212,255,.2);
    max-width:95vmin;max-height:95vmin
}

.board{
    display:grid;
    grid-template-columns:repeat(8,1fr);
    grid-template-rows:repeat(8,1fr);
    width:85vmin;height:85vmin;
    max-width:600px;max-height:600px;
    border:3px solid rgba(0,212,255,.4)
}

.square{
    display:flex;align-items:center;justify-content:center;
    font-size:clamp(2rem,8vmin,4rem);
    cursor:pointer;user-select:none;
    transition:all .2s ease;aspect-ratio:1
}

.light{
    background:linear-gradient(145deg,#b3c2d4,#9aa9ba)
}
.dark{
    background:linear-gradient(145deg,#6b7688,#4d586b);
}

.selected{
    background:#e8de5a!important
}

.piece{
    z-index:1;
    transition:transform .1s ease
}

.piece:hover{transform:scale(1.08)}

.piece.white{
    color:#ffffff;
    text-shadow:
        2px 2px 4px rgba(0,0,0,.8),
        0 0 10px rgba(255,255,255,.3);
}

.piece.black{
    color:#111111;
    text-shadow:
        2px 2px 4px rgba(0,0,0,.6);
}

.status{
    margin-top:1rem;
    color:#00d4ff;
    font-size:clamp(.9rem,3vw,1.2rem);
    text-align:center;
    min-height:1.5rem
}
</style>
</head>

<body>

<h1 class="title">Stock Atlantic Salmon</h1>

<div class="game-container">
    <div class="board" id="board"></div>
</div>

<div class="status" id="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

<script>
(function(){

    let g = new Chess(),
        sWorker = null,
        sel = null,
        lastMv = null;

    const PIE = {
        w:{k:'♔',q:'♕',r:'♖',b:'♗',n:'♘',p:'♙'},
        b:{k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'}
    };

    function init(){
        render();
    }

    function render(){
        const board = document.getElementById('board');
        board.innerHTML = '';

        for(let r=0;r<8;r++){
            for(let f=0;f<8;f++){

                const sq = 'abcdefgh'[f] + '87654321'[r];
                const light = ((r+f) & 1) === 0;

                const cell = document.createElement('div');
                cell.className = 'square ' + (light ? 'light' : 'dark');
                cell.dataset.sq = sq;

                const piece = g.get(sq);

                if(piece){
                    const span = document.createElement('span');
                    span.className = 'piece ' + (piece.color === 'w' ? 'white' : 'black');
                    span.textContent = PIE[piece.color][piece.type];
                    cell.appendChild(span);
                }

                cell.onclick = function(){ onClickSquare(sq); };

                board.appendChild(cell);
            }
        }
    }

    function onClickSquare(sq){
        if(g.turn() !== 'w') return;

        const p = g.get(sq);

        if(p && p.color === 'w' && !sel){
            sel = sq;
            return;
        }

        if(sel){
            const move = g.move({
                from: sel,
                to: sq,
                promotion:'q'
            });

            if(move){
                sel = null;
                render();
                
                if(g.history().length === 1 && move.from === 'e2' && move.to === 'e4'){
                    g.move({from:'e7', to:'e5'});
                    render();
                }
            } else {
                sel = null;
            }
        }
    }

    window.addEventListener('load', init);

})();
</script>

</body>
</html>

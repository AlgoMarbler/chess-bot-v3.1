<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Stock Atlantic Salmon</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{margin:0;height:100vh;width:100vw;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#0a0a1a 0%,#1a1a3e 50%,#0d1b2a 100%);font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;overflow:hidden;padding:10px;position:relative}
        body::before{content:'';position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(circle at 20% 50%,rgba(0,212,255,0.1) 0%,transparent 50%),radial-gradient(circle at 80% 80%,rgba(0,100,255,0.1) 0%,transparent 50%),radial-gradient(circle at 40% 20%,rgba(0,150,255,0.05) 0%,transparent 50%);pointer-events:none}
        .title{font-size:clamp(1.5rem,5vw,3rem);font-weight:900;text-transform:uppercase;letter-spacing:.15em;background:linear-gradient(90deg,#00d4ff,#0099ff,#00d4ff);background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-shadow:0 0 30px rgba(0,212,255,.5);margin-bottom:1rem;animation:shimmer 3s linear infinite;z-index:1;text-align:center}
        @keyframes shimmer{to{background-position:200% center}}
        .game-container{position:relative;z-index:1;padding:10px;background:rgba(0,0,0,.3);border-radius:10px;border:1px solid rgba(0,212,255,.2);box-shadow:0 0 50px rgba(0,100,255,.2),inset 0 0 50px rgba(0,0,0,.5)}
        .board{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);width:80vmin;height:80vmin;max-width:560px;max-height:560px;border:3px solid rgba(0,212,255,.5);box-shadow:0 0 30px rgba(0,100,255,.3),0 0 60px rgba(0,50,150,.2)}
        .square{display:flex;align-items:center;justify-content:center;font-size:clamp(1.8rem,7vmin,3.5rem);cursor:pointer;user-select:none;transition:all .2s ease;width:100%;height:100%;position:relative}
        .light{background:linear-gradient(145deg,#b0c0d0,#98a8b8)}
        .dark{background:linear-gradient(145deg,#6a7585,#5a6575)}
        .selected{background:#f7ec5e!important;box-shadow:inset 0 0 20px rgba(247,236,94,.6)}
        .valid-light::after,.valid-dark::after{content:'';position:absolute;width:25%;height:25%;border-radius:50%;box-shadow:0 0 8px rgba(0,0,0,.2)}
        .valid-light::after{background:#6a7585;box-shadow:0 0 8px rgba(106,117,133,.6)}
        .valid-dark::after{background:#b0c0d0;box-shadow:0 0 8px rgba(176,192,208,.6)}
        .last{box-shadow:inset 0 0 0 4px rgba(0,212,255,.6)}
        .check{background:#ff4757!important;animation:pulse 1s ease-in-out infinite}
        @keyframes pulse{0%,100%{box-shadow:inset 0 0 20px rgba(255,71,87,.8)}50%{box-shadow:inset 0 0 40px rgba(255,71,87,1)}}
        .piece{z-index:1;transition:transform .1s ease;display:flex;align-items:center;justify-content:center;width:100%;height:100%}
        .piece:hover{transform:scale(1.1)}
        .piece-white{color:#ffffff;text-shadow:2px 2px 4px rgba(0,0,0,.8),0 0 15px rgba(255,255,255,.3)}
        .piece-black{color:#1a1a1a;text-shadow:1px 1px 2px rgba(255,255,255,.2),0 0 10px rgba(0,0,0,.4)}
        .status{margin-top:1rem;color:#00d4ff;font-size:clamp(.9rem,3vw,1.2rem);text-align:center;text-shadow:0 0 10px rgba(0,212,255,.5);min-height:1.5rem;z-index:1}
        .difficulty-panel{position:fixed;right:20px;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.4);border:1px solid rgba(0,212,255,.3);border-radius:10px;padding:15px;box-shadow:0 0 30px rgba(0,100,255,.2);z-index:10;transition:opacity .3s ease}
        .difficulty-panel.locked{opacity:.5;pointer-events:none}
        .difficulty-title{color:#00d4ff;font-size:1rem;font-weight:bold;text-align:center;margin-bottom:15px;text-transform:uppercase;letter-spacing:0.1em;text-shadow:0 0 10px rgba(0,212,255,.5)}
        .difficulty-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
        .difficulty-btn{width:50px;height:50px;border:2px solid rgba(0,212,255,.5);background:rgba(0,0,0,.3);color:#00d4ff;font-size:1.2rem;font-weight:bold;cursor:pointer;border-radius:8px;transition:all .3s ease}
        .difficulty-btn:hover:not(:disabled){transform:scale(1.05);box-shadow:0 0 15px rgba(0,212,255,.4)}
        .difficulty-btn.active{background:linear-gradient(135deg,#00d4ff,#0099ff);color:#0a0a1a;border-color:#00d4ff;box-shadow:0 0 20px rgba(0,212,255,.6)}
        .difficulty-btn:disabled{cursor:not-allowed;opacity:.6}
        .difficulty-btn.level-6{border-color:rgba(255,50,50,.8);background:rgba(50,0,0,.4);color:#ff4444;text-shadow:0 0 10px rgba(255,68,68,.8),0 0 20px rgba(255,0,0,.5)}
        .difficulty-btn.level-6:hover:not(:disabled){box-shadow:0 0 20px rgba(255,68,68,.6),0 0 40px rgba(255,0,0,.3)}
        .difficulty-btn.level-6.active{background:linear-gradient(135deg,#ff4444,#cc0000);color:#fff;border-color:#ff6666;box-shadow:0 0 25px rgba(255,68,68,.8),0 0 50px rgba(255,0,0,.4)}
        @media (max-width: 900px) {
            .difficulty-panel{right:10px;padding:12px}
            .difficulty-btn{width:45px;height:45px;font-size:1.1rem}
            .board{width:75vmin;height:75vmin}
        }
        @media (max-width: 700px) {
            .difficulty-panel{position:static;transform:none;margin-top:15px}
            .difficulty-title{margin-bottom:10px}
            .board{width:70vmin;height:70vmin}
        }
    </style>
</head>
<body>
    <h1 class="title" id="mainTitle">Stock Atlantic Salmon</h1>
    <div class="game-container">
        <div class="board" id="board"></div>
    </div>
    <div class="status" id="status"></div>

    <div class="difficulty-panel" id="diffPanel">
        <div class="difficulty-title">Level</div>
        <div class="difficulty-grid">
            <button class="difficulty-btn" data-level="1" onclick="setDifficulty(1)">1</button>
            <button class="difficulty-btn" data-level="2" onclick="setDifficulty(2)">2</button>
            <button class="difficulty-btn" data-level="3" onclick="setDifficulty(3)">3</button>
            <button class="difficulty-btn" data-level="4" onclick="setDifficulty(4)">4</button>
            <button class="difficulty-btn" data-level="5" onclick="setDifficulty(5)">5</button>
            <button class="difficulty-btn level-6" data-level="6" onclick="setDifficulty(6)">6</button>
        </div>
        <div style="color:#b8c5d6;font-size:0.7rem;text-align:center;margin-top:12px;opacity:.8;line-height:1.4">
            <span style="color:#4ade80;text-shadow:0 0 8px rgba(74,222,128,0.5)">1 = you cook the salmon</span><br>
            <span style="color:#f87171;text-shadow:0 0 8px rgba(248,113,113,0.5)">6 = the salmon cooks you</span>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <script>
    (function(){
        let g = new Chess(), sWorker = null, sel = null, lastMv = null, overFlag = false, moveCount = 0;
        let currentDifficulty = 5;
        let gameStarted = false;
        const PIE = {w:{k:'♔',q:'♕',r:'♖',b:'♗',n:'♘',p:'♙'}, b:{k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'}};

        const depthTable = {
            24: [4, 5, 7, 10, 11, 14],
            21: [4, 5, 9, 11, 12, 15],
            18: [4, 6, 9, 12, 13, 16],
            12: [4, 6, 10, 13, 14, 17],
            7: [4, 7, 10, 14, 15, 18],
            0: [4, 8, 10, 15, 16, 18]
        };

        function getAdaptiveDepth(){
            const fen = g.fen();
            const pieceCount = (fen.match(/[prnbqkPRNBQK]/g) || []).length;
            let threshold;
            if(pieceCount >= 24) threshold = 24;
            else if(pieceCount >= 21) threshold = 21;
            else if(pieceCount >= 18) threshold = 18;
            else if(pieceCount >= 12) threshold = 12;
            else if(pieceCount >= 7) threshold = 7;
            else threshold = 0;
            return depthTable[threshold][currentDifficulty - 1];
        }

        window.setDifficulty = function(level){
            if(gameStarted) return;
            currentDifficulty = level;
            document.querySelectorAll('.difficulty-btn').forEach(btn => {
                btn.classList.remove('active');
                if(parseInt(btn.dataset.level) === level) btn.classList.add('active');
            });
        };

        function lockDifficulty(){
            gameStarted = true;
            document.getElementById('diffPanel').classList.add('locked');
            document.querySelectorAll('.difficulty-btn').forEach(btn => btn.disabled = true);
        }

        function unlockDifficulty(){
            gameStarted = false;
            document.getElementById('diffPanel').classList.remove('locked');
            document.querySelectorAll('.difficulty-btn').forEach(btn => btn.disabled = false);
        }

        function init(){
            try {
                sWorker = new Worker('neuralnet.js');
                sWorker.onmessage = function(ev){
                    const d = ev.data;
                    if(typeof d === 'string' && d.indexOf('bestmove') !== -1){
                        const token = d.split('bestmove ')[1].split(' ')[0];
                        if(token && token !== '(none)'){
                            g.move({from: token.slice(0,2), to: token.slice(2,4), promotion: token[4]});
                            lastMv = {from: token.slice(0,2), to: token.slice(2,4)};
                            render();
                            handleGameOver();
                        }
                    }
                };
                sWorker.postMessage('uci');
            } catch(e) {
                document.getElementById('status').textContent = 'the almighty salmon is sleeping, check back later';
            }
            render();
            updateStatus();
        }

        function updateStatus(){
            const st = document.getElementById('status');
            st.textContent = g.game_over() ? '' : (g.turn() === 'w' ? '' : '');
        }

        function handleGameOver(){
            if(!g.game_over() || overFlag){
                updateStatus();
                return;
            }
            overFlag = true;
            unlockDifficulty();

            if(g.in_checkmate()){
                if(g.turn() === 'w'){
                    const msg = `the level ${currentDifficulty} almighty atlantic salmon has outmanoeuvred you!`;
                    setTimeout(()=>{ alert(msg); resetGame(); }, 100);
                } else {
                    let msg;
                    if(currentDifficulty === 6){
                        msg = 'you have defeated the level 6 almighty atlantic salmon! are you even human?';
                    } else {
                        msg = `you have defeated the level ${currentDifficulty} almighty atlantic salmon! try level ${currentDifficulty + 1}?`;
                    }
                    setTimeout(()=>{ alert(msg); resetGame(); }, 100);
                }
            } else if(g.in_stalemate()){
                setTimeout(()=>{ alert('stale mate'); resetGame(); }, 100);
            } else if(g.in_draw()){
                setTimeout(()=>{ alert('1/2 -- 1/2'); resetGame(); }, 100);
            }
            updateStatus();
        }

        window.resetGame = function(){
            g = new Chess();
            sel = null;
            lastMv = null;
            overFlag = false;
            moveCount = 0;
            unlockDifficulty();
            render();
            updateStatus();
        };

        function render(){
            const board = document.getElementById('board');
            board.innerHTML = '';
            for(let r=0;r<8;r++){
                for(let f=0;f<8;f++){
                    const sq = 'abcdefgh'[f] + '87654321'[r];
                    const light = ((r+f) & 1) === 0;
                    const cell = document.createElement('div');
                    cell.className = 'square ' + (light ? 'light' : 'dark');
                    cell.dataset.sq = sq;
                    if(sel === sq) cell.classList.add('selected');
                    if(lastMv && (lastMv.from === sq || lastMv.to === sq)) cell.classList.add('last');

                    const piece = g.get(sq);
                    if(piece){
                        const span = document.createElement('span');
                        span.className = 'piece piece-' + (piece.color === 'w' ? 'white' : 'black');
                        span.textContent = PIE[piece.color][piece.type];
                        cell.appendChild(span);
                    }

                    if(sel){
                        const moves = g.moves({square: sel, verbose: 1});
                        if(moves.find(m => m.to === sq)){
                            cell.classList.add(light ? 'valid-light' : 'valid-dark');
                        }
                    }

                    if(g.in_check() && piece?.type === 'k' && piece.color === g.turn()) cell.classList.add('check');

                    cell.onclick = function(){ onClickSquare(sq); };
                    board.appendChild(cell);
                }
            }
        }

        function onClickSquare(sq){
            if(g.game_over() || g.turn() !== 'w') return;
            
            if(!gameStarted && !overFlag){
                lockDifficulty();
            }
            
            const p = g.get(sq);

            if(p && p.color === 'w' && !sel){
                sel = sq;
                render();
                return;
            }

            if(sel){
                const candidate = g.moves({square: sel, verbose: 1}).find(m => m.to === sq);
                if(candidate){
                    g.move({from: sel, to: sq, promotion: 'q'});
                    lastMv = {from: sel, to: sq};
                    sel = null;
                    moveCount++;
                    render();
                    handleGameOver();
                    
                    if(!g.game_over()){
                        if(moveCount === 1 && lastMv.from === 'e2' && lastMv.to === 'e4'){
                            setTimeout(() => {
                                g.move({from: 'e7', to: 'e5'});
                                lastMv = {from: 'e7', to: 'e5'};
                                render();
                                handleGameOver();
                            }, 300);
                        } else if(sWorker){
                            const depth = getAdaptiveDepth();
                            sWorker.postMessage('position fen ' + g.fen());
                            sWorker.postMessage('go depth ' + depth);
                        }
                    }
                } else {
                    sel = null;
                    render();
                }
            }
        }

        window.addEventListener('load', init, false);
    })();
    </script>
</body>
</html>
